  <path d="M392 256c18-10 32-28 44-52" stroke="url(#trail)" stroke-width="14" stroke-linecap="round" stroke-opacity=".7"/>
  <circle cx="447" cy="192" r="12" fill="#B0FFF5"/>
  <circle cx="256" cy="288" r="26" fill="#0C182A"/>
  <circle cx="256" cy="288" r="15" fill="#B0FFF5"/>
