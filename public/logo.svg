<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>AuuMail</title>
  <defs>
    <linearGradient id="tile" x1="64" y1="24" x2="424" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172B42"/>
      <stop offset=".55" stop-color="#0C182A"/>
      <stop offset="1" stop-color="#091221"/>
    </linearGradient>
    <linearGradient id="left" x1="150" y1="420" x2="248" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05B5C7"/>
      <stop offset="1" stop-color="#27E5DD"/>
    </linearGradient>
    <linearGradient id="right" x1="266" y1="118" x2="362" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B0FFF5"/>
      <stop offset="1" stop-color="#38D6F0"/>
    </linearGradient>
    <linearGradient id="flap" x1="206" y1="296" x2="306" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B0FFF5"/>
      <stop offset="1" stop-color="#72F0F2"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#tile)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="126.5" stroke="#B8E4F7" stroke-opacity=".12"/>
  <!-- The Auu "A": its crossbar is an envelope flap folding into a glowing message node. -->
  <path d="M152 420 247 118" stroke="url(#left)" stroke-width="58" stroke-linecap="round"/>
  <path d="M265 118 360 420" stroke="url(#right)" stroke-width="58" stroke-linecap="round"/>
  <path d="M206 296 256 348 306 296" stroke="url(#flap)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="348" r="24" fill="#0C182A"/>
  <circle cx="256" cy="348" r="14" fill="#B0FFF5"/>
</svg>
